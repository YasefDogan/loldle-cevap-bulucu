<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0; width: 240px; padding: 16px;
      background: #0a1428; color: #f0e6d2;
      font: 14px/1.4 sans-serif; text-align: center;
    }
    h1 { font-size: 13px; color: #c8aa6e; margin: 0 0 10px; letter-spacing: .5px; text-transform: uppercase; }
    .row { margin: 6px 0; }
    .mode { color: #a09b8c; font-size: 12px; }
    .name { font-size: 22px; font-weight: bold; color: #f0e6d2; }
    .info { color: #a09b8c; font-size: 13px; }
    button {
      margin-top: 10px; padding: 6px 12px; cursor: pointer;
      background: #c8aa6e; color: #0a1428; border: none;
      border-radius: 4px; font-weight: bold; font-size: 13px;
    }
    button:hover { background: #f0c040; }
  </style>
</head>
<body>
  <h1 id="title">Günün Cevabı</h1>
  <div id="out" class="info"></div>
  <script src="popup.js"></script>
</body>
</html>
